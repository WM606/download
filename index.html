<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WM</title>
    <style>
        /* --- التصميم المُحدث لدمج الخلفيات --- */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            
            /* 1. الخلفية العامة (BODY): هنا يجب وضع wm.png */
            /* حاليًا نستخدم لون داكن، يرجى استبدال اللون بصورة wm.jpg عند توفرها */
            background-color: #1a1a1a; 
            /* background-image: url('wm.jpg'); */ 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        
        .container {
            /* 2. خلفية صندوق التنزيل (CONTAINER): استخدام WM.png */
            background-image: url('WM.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            /* طبقة شفافة لضمان قراءة النص فوق الصورة */
            position: relative;
            z-index: 1;

            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); 
            max-width: 500px;
            width: 90%;
            margin-top: 50px;
            overflow: hidden; /* لمنع ظهور أي شيء خارج حدود الصندوق */
        }
        
        /* طبقة تظليل داخلية لزيادة تباين النص مع الخلفية (اختياري) */
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.4); /* تظليل 40% */
            z-index: -1;
        }

        /* تعديل ألوان النص لتظهر فوق الخلفية المظلمة لـ WM.jpg */
        h1 {
            color: #ffffff; /* أبيض */
            margin-bottom: 30px;
        }
        
        .download-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        
        .download-btn {
            display: inline-block;
            padding: 15px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5); 
        }
        
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }
        
        .red {
            background-color: #e74c3c;
        }
        
        .instructions {
            margin-top: 30px;
            color: #f0f0f0; /* رمادي فاتح ليظهر فوق الخلفية */
            font-size: 14px;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <h1>صفحة التنزيل</h1>
        
        <div class="download-buttons">
            <a href="https://github.com/WM606/download/raw/refs/heads/main/i.sh" class="download-btn red">انقر لتنزيل الملف</a>
        </div>
        
        <div class="instructions">
            <p>ملف منضور الايباد جاهز للتنزيل لا تنسى الدعم والا بتوقف من مشاركة الملف او اي ملف ثاني</p>
        </div>
    </div>
</body>
</html>
